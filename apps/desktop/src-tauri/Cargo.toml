[package]
name = "ipmsgsec-desktop"
version = "0.1.0"
description = "IPMsgSec desktop client"
authors = ["IPMsgSec contributors"]
edition = "2024"

[workspace]

[lib]
name = "ipmsgsec_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
ipmsgsec-app = { path = "../../../crates/app" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
