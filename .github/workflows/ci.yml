name: CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERUS_VERSION: 0.2026.11.02.8bf68ee
  VERUS_SHA256_X86_LINUX: f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  desktop-windows:
    name: Windows Tauri compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend for Tauri context generation
        working-directory: apps/desktop
        run: |
          npm install
          npm run build
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Check Tauri desktop crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verus-required Rust components
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustc-dev --component llvm-tools
          rustup default 1.99.1
      - name: Download pinned Verus release through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="$RUNNER_TEMP/verus-$VERUS_VERSION-x86-linux.zip"
          asset_name="verus-$VERUS_VERSION-x86-linux.zip"

          # Resolve the exact pinned release asset through GitHub's Releases API.
          asset_id="$(gh api --paginate repos/verus-lang/verus/releases \
            --jq ".[] | select(.tag_name == \"release/$VERUS_VERSION\") | .assets[] | select(.name == \"$asset_name\") | .id" \
            | head -n 1)"
          if [[ -z "$asset_id" ]]; then
            echo "Could not find $asset_name in release tag release/$VERUS_VERSION" >&2
            exit 1
          fi

          # Download the binary asset from the API endpoint (not the browser
          # release URL), following GitHub's temporary redirect to the asset.
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/verus-lang/verus/releases/assets/$asset_id" > "$archive"
          test -s "$archive"

          echo "$VERUS_SHA256_X86_LINUX  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/verus"
          unzip -q "$archive" -d "$RUNNER_TEMP/verus"
          verifier="$(find "$RUNNER_TEMP/verus" -type f -name verus -perm -u+x -print -quit)"
          cargo_verus="$(find "$RUNNER_TEMP/verus" -type f -name cargo-verus -perm -u+x -print -quit)"
          test -n "$verifier"
          test -n "$cargo_verus"
          verus_dir="$(dirname "$verifier")"
          printf '%s\n' "$verus_dir" >> "$GITHUB_PATH"
      - name: Verify standalone smoke proof
        run: verus verification/smoke.rs
      - name: Verify the runtime protocol-core crate
        run: cargo verus verify -p ipmsgsec-protocol-core
