name: Build installers

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: Installer formats to generate
        type: choice
        required: true
        default: all
        options:
          - all
          - nsis
          - msi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installers:
    name: Windows installers (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri installers
        working-directory: apps/desktop
        env:
          BUNDLE_FORMATS: ${{ inputs.bundles }}
        shell: pwsh
        run: |
          $bundles = if ($env:BUNDLE_FORMATS -eq "all") { "nsis,msi" } else { $env:BUNDLE_FORMATS }
          npx tauri build --bundles $bundles

      - name: Upload NSIS installer
        if: inputs.bundles == 'all' || inputs.bundles == 'nsis'
        uses: actions/upload-artifact@v4
        with:
          name: IPMsgSec-windows-x64-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload MSI installer
        if: inputs.bundles == 'all' || inputs.bundles == 'msi'
        uses: actions/upload-artifact@v4
        with:
          name: IPMsgSec-windows-x64-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
